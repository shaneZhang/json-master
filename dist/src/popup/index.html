<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Master</title>
  <script type="module" crossorigin src="/popup.js"></script>
  <link rel="modulepreload" crossorigin href="/storage.js">
  <link rel="modulepreload" crossorigin href="/jsonFormatter.js">
  <link rel="stylesheet" crossorigin href="/assets/styles/popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 2V8H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 13L8 15L10 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 13L16 15L14 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>JSON Master</span>
      </div>
      <div class="header-actions">
        <button id="btn-settings" class="icon-btn" title="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v6m0 6v6m4.22-10.22l4.24-4.24M6.34 17.66l-4.24 4.24M23 12h-6m-6 0H1m20.24 4.24l-4.24-4.24M6.34 6.34L2.1 2.1"/>
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="format">格式化</button>
      <button class="tab-btn" data-tab="validate">验证</button>
      <button class="tab-btn" data-tab="convert">转换</button>
      <button class="tab-btn" data-tab="history">历史</button>
    </nav>

    <main class="main-content">
      <!-- 格式化面板 -->
      <div id="panel-format" class="panel active">
        <div class="toolbar">
          <div class="toolbar-group">
            <button id="btn-format" class="btn btn-primary">格式化</button>
            <button id="btn-minify" class="btn btn-secondary">压缩</button>
          </div>
          <div class="toolbar-group">
            <select id="select-indent" class="select">
              <option value="2">2 空格缩进</option>
              <option value="4">4 空格缩进</option>
              <option value="tab">Tab 缩进</option>
            </select>
            <label class="checkbox">
              <input type="checkbox" id="chk-sort-keys">
              <span>排序键名</span>
            </label>
          </div>
        </div>
        
        <div class="editor-container">
          <div class="editor-wrapper">
            <div class="editor-header">
              <span>输入</span>
              <div class="editor-actions">
                <button id="btn-paste" class="text-btn">粘贴</button>
                <button id="btn-clear" class="text-btn">清空</button>
                <button id="btn-sample" class="text-btn">示例</button>
              </div>
            </div>
            <textarea id="input-editor" class="editor" placeholder="在此粘贴 JSON 数据..."></textarea>
          </div>
          
          <div class="editor-wrapper">
            <div class="editor-header">
              <span>输出</span>
              <div class="editor-actions">
                <button id="btn-copy" class="text-btn">复制</button>
                <button id="btn-download" class="text-btn">下载</button>
              </div>
            </div>
            <textarea id="output-editor" class="editor" readonly placeholder="格式化后的结果将显示在这里..."></textarea>
          </div>
        </div>
        
        <div id="status-bar" class="status-bar">
          <span id="status-text">就绪</span>
          <div class="stats">
            <span id="stats-length">字符: 0</span>
            <span id="stats-lines">行数: 0</span>
          </div>
        </div>
      </div>

      <!-- 验证面板 -->
      <div id="panel-validate" class="panel">
        <div class="toolbar">
          <button id="btn-validate" class="btn btn-primary">验证 JSON</button>
        </div>
        
        <div class="editor-container single">
          <div class="editor-wrapper">
            <div class="editor-header">
              <span>JSON 输入</span>
              <div class="editor-actions">
                <button id="btn-validate-paste" class="text-btn">粘贴</button>
                <button id="btn-validate-clear" class="text-btn">清空</button>
              </div>
            </div>
            <textarea id="validate-input" class="editor" placeholder="在此粘贴要验证的 JSON 数据..."></textarea>
          </div>
        </div>
        
        <div id="validation-result" class="validation-result">
          <div class="result-placeholder">点击"验证 JSON"按钮开始验证</div>
        </div>
      </div>

      <!-- 转换面板 -->
      <div id="panel-convert" class="panel">
        <div class="toolbar">
          <div class="toolbar-group">
            <select id="select-convert-type" class="select">
              <option value="json-to-yaml">JSON → YAML</option>
              <option value="yaml-to-json">YAML → JSON</option>
              <option value="json-to-js">JSON → JS 对象</option>
              <option value="json-to-xml">JSON → XML</option>
              <option value="json-to-csv">JSON → CSV</option>
            </select>
            <button id="btn-convert" class="btn btn-primary">转换</button>
          </div>
        </div>
        
        <div class="editor-container">
          <div class="editor-wrapper">
            <div class="editor-header">
              <span>输入</span>
              <div class="editor-actions">
                <button id="btn-convert-paste" class="text-btn">粘贴</button>
                <button id="btn-convert-clear" class="text-btn">清空</button>
              </div>
            </div>
            <textarea id="convert-input" class="editor" placeholder="在此粘贴数据..."></textarea>
          </div>
          
          <div class="editor-wrapper">
            <div class="editor-header">
              <span>输出</span>
              <div class="editor-actions">
                <button id="btn-convert-copy" class="text-btn">复制</button>
                <button id="btn-convert-download" class="text-btn">下载</button>
              </div>
            </div>
            <textarea id="convert-output" class="editor" readonly placeholder="转换后的结果将显示在这里..."></textarea>
          </div>
        </div>
      </div>

      <!-- 历史面板 -->
      <div id="panel-history" class="panel">
        <div class="toolbar">
          <button id="btn-clear-history" class="btn btn-secondary">清空历史</button>
        </div>
        <div id="history-list" class="history-list">
          <div class="history-empty">暂无历史记录</div>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
