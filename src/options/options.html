<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Master - 设置</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 28px;
      color: #4CAF50;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #333;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: #555;
    }

    .form-group select,
    .form-group input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-group select:focus,
    .form-group input[type="number"]:focus {
      outline: none;
      border-color: #4CAF50;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .checkbox-group label {
      margin: 0;
      cursor: pointer;
      font-weight: normal;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #4CAF50;
      color: white;
    }

    .btn-primary:hover {
      background: #45a049;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      margin-left: 10px;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn-danger {
      background: #f44336;
      color: white;
    }

    .btn-danger:hover {
      background: #da190b;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 30px;
    }

    .info-section {
      background: #e3f2fd;
      border-left: 4px solid #2196F3;
      padding: 16px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 20px;
    }

    .info-section h3 {
      font-size: 14px;
      color: #1976D2;
      margin-bottom: 8px;
    }

    .info-section p {
      font-size: 13px;
      color: #555;
    }

    .shortcut-list {
      list-style: none;
    }

    .shortcut-list li {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .shortcut-list li:last-child {
      border-bottom: none;
    }

    .shortcut-key {
      background: #f0f0f0;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }

    .status-message {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 6px;
      color: white;
      font-weight: 500;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
    }

    .status-message.show {
      opacity: 1;
      transform: translateY(0);
    }

    .status-message.success {
      background: #4CAF50;
    }

    .status-message.error {
      background: #f44336;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>⚙️ JSON Master 设置</h1>
      <p>自定义您的 JSON 格式化体验</p>
    </header>

    <div class="card">
      <h2>格式化选项</h2>
      
      <div class="form-group">
        <label for="indent">默认缩进</label>
        <select id="indent">
          <option value="2">2 个空格</option>
          <option value="4">4 个空格</option>
          <option value="tab">Tab 字符</option>
        </select>
      </div>

      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="sortKeys">
          <label for="sortKeys">默认排序对象键名（按字母顺序）</label>
        </div>
      </div>

      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="escapeUnicode">
          <label for="escapeUnicode">转义 Unicode 字符</label>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>界面设置</h2>
      
      <div class="form-group">
        <label for="theme">主题</label>
        <select id="theme">
          <option value="auto">自动（跟随系统）</option>
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </div>

      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="autoFormat">
          <label for="autoFormat">自动格式化 JSON 页面</label>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>历史记录</h2>
      
      <div class="form-group">
        <label for="maxHistoryItems">最大历史记录数</label>
        <input type="number" id="maxHistoryItems" min="5" max="100" value="20">
      </div>

      <div class="form-group">
        <button id="clearHistory" class="btn btn-danger">清空所有历史记录</button>
      </div>
    </div>

    <div class="card">
      <h2>键盘快捷键</h2>
      
      <ul class="shortcut-list">
        <li>
          <span>打开 JSON Master</span>
          <span class="shortcut-key">Ctrl+Shift+J</span>
        </li>
        <li>
          <span>格式化（在插件内）</span>
          <span class="shortcut-key">Ctrl+Enter</span>
        </li>
        <li>
          <span>复制结果</span>
          <span class="shortcut-key">Ctrl+C</span>
        </li>
      </ul>

      <div class="info-section">
        <h3>💡 提示</h3>
        <p>您可以在浏览器的扩展程序设置中修改键盘快捷键。</p>
      </div>
    </div>

    <div class="card">
      <h2>关于</h2>
      <p><strong>JSON Master</strong> v1.0.0</p>
      <p style="margin-top: 10px; color: #666;">
        一个简单、快速、功能强大的 JSON 格式化工具。
      </p>
      <p style="margin-top: 10px; color: #666;">
        功能包括：格式化、压缩、验证、转换（YAML/XML/CSV/JS）、历史记录等。
      </p>
    </div>

    <div class="actions">
      <button id="resetSettings" class="btn btn-secondary">恢复默认</button>
      <button id="saveSettings" class="btn btn-primary">保存设置</button>
    </div>
  </div>

  <div id="statusMessage" class="status-message"></div>

  <script type="module" src="./options.ts"></script>
</body>
</html>
